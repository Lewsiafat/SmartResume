<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    font-family: 'Inter', 'Noto Sans TC', sans-serif;
    background: linear-gradient(135deg, #f4a261 0%, #e9c46a 50%, #c1666b 100%);
    display: flex; align-items: center; padding: 80px;
    color: #264653;
  }
  .left { flex: 1; }
  .name { font-size: 88px; font-weight: 800; line-height: 1.05; }
  .role { font-size: 40px; font-weight: 500; margin-top: 18px; opacity: 0.85; }
  .tag { font-size: 24px; margin-top: 36px; opacity: 0.75; }
  .right { width: 240px; height: 240px; border-radius: 50%; background: rgba(255,255,255,0.4); }
</style>
</head>
<body>
<div class="left">
  <div class="name" id="name">Loading…</div>
  <div class="role" id="role"></div>
  <div class="tag" id="tag"></div>
</div>
<div class="right"></div>
<script>
  const params = new URLSearchParams(location.search)
  document.getElementById('name').textContent = params.get('name') || 'Your Name'
  document.getElementById('role').textContent = params.get('role') || 'Full-Stack Developer'
  document.getElementById('tag').textContent = params.get('tag') || 'Building AI tooling & web apps'
</script>
</body>
</html>
