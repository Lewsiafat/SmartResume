<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    font-family: 'Inter', 'Noto Sans TC', sans-serif;
    background: #264653;
    color: ivory;
    padding: 80px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
  }
  .badge { color: #f4a261; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; }
  .title { color: #fff; font-size: 96px; font-weight: 800; line-height: 1.05; margin-top: 24px; }
  .tagline { color: #e9c46a; font-size: 32px; margin-top: 32px; line-height: 1.4; }
  .footer { color: #f4a261; font-size: 24px; }
  .accent {
    position: absolute; right: 0; top: 0; width: 16px; height: 100%;
    background: linear-gradient(180deg, #f4a261, #c1666b);
  }
</style>
</head>
<body>
<div class="accent"></div>
<div>
  <div class="badge">Case Study</div>
  <div class="title" id="title">Project Title</div>
  <div class="tagline" id="tagline">A one-line tagline</div>
</div>
<div class="footer" id="footer">— your name</div>
<script>
  const params = new URLSearchParams(location.search)
  document.getElementById('title').textContent = params.get('title') || 'Project'
  document.getElementById('tagline').textContent = params.get('tagline') || ''
  document.getElementById('footer').textContent = '— ' + (params.get('author') || 'Author')
</script>
</body>
</html>
